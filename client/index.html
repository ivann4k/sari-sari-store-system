<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sari-Sari Store System</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1d2330;--muted:#6b7280;--accent:#d9480f;--line:#e3e6ea}
@media (prefers-color-scheme:dark){:root{--bg:#14171c;--card:#1d2128;--text:#eef0f3;--muted:#9aa3af;--accent:#ff7a3d;--line:#2d333c}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--text)}
header{background:var(--accent);color:#fff;padding:14px 16px;font-weight:700}
nav{display:flex;gap:6px;padding:10px;max-width:760px;margin:auto}
nav button{flex:1}main{max-width:760px;margin:auto;padding:0 10px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
input,button{font:inherit;padding:9px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text)}
button{cursor:pointer}button.primary,nav button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.row input{flex:1;min-width:110px}
.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{padding:7px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
.low{color:#c92a2a;font-weight:700}.muted{color:var(--muted)}#msg{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:8px;display:none}
</style>
</head>
<body>
<header>Sari-Sari Store and Sales Management System</header>
<nav><button data-t="inv" class="on">Inventory</button><button data-t="sale">New Sale</button><button data-t="rep">Reports</button></nav>
<main>
<section id="inv">
  <div class="card"><b>Add product</b><div class="row" style="margin-top:8px">
    <input id="pn" placeholder="Name"><input id="pp" type="number" min="0" step="0.01" placeholder="Price"><input id="ps" type="number" min="0" placeholder="Stock">
    <button class="primary" onclick="addProduct()">Add</button></div></div>
  <div class="card"><input id="search" placeholder="Search products" oninput="loadProducts()" style="width:100%;margin-bottom:8px">
    <div class="scroll"><table><thead><tr><th>Product</th><th>Price</th><th>Stock</th><th></th></tr></thead><tbody id="ptable"></tbody></table></div></div>
</section>
<section id="sale" hidden>
  <div class="card"><b>Add to cart</b><div class="row" style="margin-top:8px"><select id="sp" style="flex:2;padding:9px"></select><input id="sq" type="number" min="1" value="1"><button onclick="addToCart()">Add</button></div></div>
  <div class="card"><div class="scroll"><table><thead><tr><th>Item</th><th>Qty</th><th>Subtotal</th><th></th></tr></thead><tbody id="cart"></tbody></table></div>
    <h3>Total: PHP <span id="total">0.00</span></h3>
    <div class="row"><input id="pay" type="number" min="0" step="0.01" placeholder="Customer payment"><button class="primary" onclick="checkout()">Complete sale</button></div></div>
</section>
<section id="rep" hidden>
  <div class="card"><div class="row"><input id="rd" type="date"><button onclick="loadReport()">Show report</button></div><div id="report" class="muted">Pick a date.</div></div>
  <div class="card"><b>Recent sales</b><div class="scroll"><table><thead><tr><th>#</th><th>Date</th><th>Items</th><th>Total</th></tr></thead><tbody id="hist"></tbody></table></div></div>
</section>
</main>
<div id="msg"></div>
<script>
const API='/api';let products=[],cart=[];
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>Number(n).toFixed(2);
function toast(t){const m=$('msg');m.textContent=t;m.style.display='block';setTimeout(()=>m.style.display='none',2800)}
async function api(path,opt={}){
  const r=await fetch(API+path,{headers:{'Content-Type':'application/json'},...opt,body:opt.body?JSON.stringify(opt.body):undefined});
  const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Request failed');return d}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
  ['inv','sale','rep'].forEach(s=>$(s).hidden=s!==b.dataset.t);
  if(b.dataset.t==='sale')loadProducts();if(b.dataset.t==='rep'){$('rd').value=$('rd').value||new Date().toLocaleDateString('en-CA');loadReport();loadHistory()}});
async function loadProducts(){
  try{products=await api('/products?q='+encodeURIComponent($('search').value));
  $('ptable').innerHTML=products.map(p=>`<tr><td>${esc(p.name)}</td><td>${money(p.price)}</td><td class="${p.low?'low':''}">${p.stock}${p.low?' (low)':''}</td>
   <td><button onclick="restock(${p.id})">+Stock</button> <button onclick="editP(${p.id})">Edit</button> <button onclick="delP(${p.id})">Delete</button></td></tr>`).join('')||'<tr><td colspan="4" class="muted">No products yet.</td></tr>';
  $('sp').innerHTML=products.filter(p=>p.stock>0).map(p=>`<option value="${p.id}">${esc(p.name)} - ${money(p.price)} (${p.stock} left)</option>`).join('')}catch(e){toast(e.message)}}
async function addProduct(){try{await api('/products',{method:'POST',body:{name:$('pn').value,price:parseFloat($('pp').value),stock:parseInt($('ps').value)}});
  ['pn','pp','ps'].forEach(i=>$(i).value='');toast('Product added');loadProducts()}catch(e){toast(e.message)}}
async function restock(id){const q=parseInt(prompt('Quantity to add:'));if(!q)return;try{await api(`/products/${id}/restock`,{method:'PATCH',body:{quantity:q}});loadProducts()}catch(e){toast(e.message)}}
async function editP(id){const p=products.find(x=>x.id===id);const name=prompt('Name:',p.name);if(name===null)return;const price=parseFloat(prompt('Price:',p.price));
  try{await api('/products/'+id,{method:'PUT',body:{name,price}});loadProducts()}catch(e){toast(e.message)}}
async function delP(id){if(!confirm('Delete this product?'))return;try{await api('/products/'+id,{method:'DELETE'});loadProducts()}catch(e){toast(e.message)}}
function addToCart(){const id=parseInt($('sp').value),qty=parseInt($('sq').value),p=products.find(x=>x.id===id);
  if(!p||!(qty>0))return toast('Choose a product and quantity');
  const have=cart.filter(c=>c.id===id).reduce((a,c)=>a+c.qty,0);if(have+qty>p.stock)return toast(`Only ${p.stock-have} available`);
  const ex=cart.find(c=>c.id===id);ex?ex.qty+=qty:cart.push({id,name:p.name,price:p.price,qty});renderCart()}
function renderCart(){$('cart').innerHTML=cart.map((c,i)=>`<tr><td>${esc(c.name)}</td><td>${c.qty}</td><td>${money(c.price*c.qty)}</td><td><button onclick="cart.splice(${i},1);renderCart()">x</button></td></tr>`).join('')||'<tr><td colspan="4" class="muted">Cart is empty.</td></tr>';
  $('total').textContent=money(cart.reduce((a,c)=>a+c.price*c.qty,0))}
async function checkout(){const payment=parseFloat($('pay').value);if(!cart.length)return toast('Cart is empty');
  try{const r=await api('/sales',{method:'POST',body:{items:cart.map(c=>({productId:c.id,quantity:c.qty})),payment}});
  alert(`Sale #${r.id} complete\nTotal: PHP ${money(r.total)}\nChange: PHP ${money(r.change)}`);cart=[];$('pay').value='';renderCart();loadProducts()}catch(e){toast(e.message)}}
async function loadReport(){try{const r=await api('/reports/daily?date='+$('rd').value);
  $('report').innerHTML=`<p><b>${r.date}</b> - ${r.transactions} transaction(s) - Income: <b>PHP ${money(r.income)}</b></p>`+
  (r.items.length?`<div class="scroll"><table><tr><th>Item</th><th>Qty</th><th>Revenue</th></tr>${r.items.map(i=>`<tr><td>${esc(i.name)}</td><td>${i.quantity}</td><td>${money(i.revenue)}</td></tr>`).join('')}</table></div>`:'<p class="muted">No sales on this date.</p>')}catch(e){toast(e.message)}}
async function loadHistory(){try{const s=await api('/sales');$('hist').innerHTML=s.map(x=>`<tr><td>${x.id}</td><td>${esc(x.created_at)}</td><td>${x.items}</td><td>${money(x.total)}</td></tr>`).join('')||'<tr><td colspan="4" class="muted">No sales yet.</td></tr>'}catch(e){toast(e.message)}}
renderCart();loadProducts();
</script>
</body>
</html>
